name: TestXmlStructPugixml

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      os:
        required: true
        type: string
      arch:
        required: true
        type: string

jobs:
  test:
    name: TestXmlStructPugixml - Julia ${{ inputs.version }} - ${{ inputs.os }} - ${{ inputs.arch }} - ${{ github.event_name }}
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ inputs.version }}
          arch: ${{ inputs.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: XmlStructPugixml.jl
      - uses: julia-actions/julia-runtest@v1
        with:
          project: XmlStructPugixml.jl
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: XmlStructPugixml.jl/src
