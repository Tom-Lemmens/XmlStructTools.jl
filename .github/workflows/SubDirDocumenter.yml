name: SubDirDocumenter

on:
  workflow_call:
    inputs:
      subdir:
        required: true
        type: string
    secrets:
      DOCUMENTER_KEY:
        required: true
        
jobs:
  build:
    permissions:
      contents: write
      pull-requests: read
      statuses: write
    defaults:
      run:
        working-directory: ${{ inputs.subdir }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'
      - uses: julia-actions/cache@v3
      - name: Install dependencies
        # The packages in this repository are not registered, so a docs environment has to be
        # pointed at the ones in the checkout before it can resolve the package it documents.
        run: >
          julia --project=docs/ -e '
          using Pkg;
          siblings = filter(isdir, [abspath(joinpath("..", p)) for p in
            ["AbstractXsdTypes.jl", "XmlStructPugixml.jl", "XsdToStruct.jl", "XmlStructLoader.jl", "XmlStructWriter.jl"]]);
          Pkg.develop([PackageSpec(path = p) for p in siblings]);
          Pkg.develop(PackageSpec(path = pwd()));
          Pkg.instantiate()'
      - name: Build and deploy
        env:
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs/ docs/make.jl
